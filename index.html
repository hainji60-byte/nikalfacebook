<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click to Visit</title>
    
    <!-- Facebook Open Graph Tags (Bari Taswir ke liye) -->
    <meta property="og:title" content="Click Here to Watch More">
    <meta property="og:description" content="Click to open the link.">
    <meta property="og:image" content="https://i.postimg.cc/dtNjNS7L/play-image-1786546075477-600x600.jpg">
    <meta property="og:url" content="https://hainji60-byte.github.io/hiting/">
    <meta property="og:type" content="website">

    <!-- Jaise hi koi page khole, yeh foran aap ki personal website par redirect kar dega -->
    <meta http-equiv="refresh" content="0; url=https://www.profitableratecpmnetwork.com/xd2j8g7xxu?key=51f1945fe59b338967a5c543f9c9c2ae">

    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
    </style>
</head>
<body>
    <p>Redirecting to website...</p>

    <!-- Background Hit Counter -->
    <div style="display:none;">
        <span id="hit-count">1</span>
    </div>

    <script>
        let visits = localStorage.getItem('page_views');
        if (!visits) { visits = 1; } else { visits = Number(visits) + 1; }
        localStorage.setItem('page_views', visits);
    </script>
</body>
</html>
